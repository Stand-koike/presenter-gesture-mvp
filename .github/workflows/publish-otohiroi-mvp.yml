# おとひろい専用リポジトリへミラーする（手動実行）
# presenter のトークンは otohiroi-mvp- に書けないため、PAT を Secrets に登録して使う
name: Publish to otohiroi-mvp-

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout export branch
        uses: actions/checkout@v4
        with:
          ref: export/otohiroi-mvp-initial
          fetch-depth: 1

      - name: Push to otohiroi-mvp-
        env:
          PUSH_TOKEN: ${{ secrets.OTOHIROI_MVP_PUSH_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::Secrets に OTOHIROI_MVP_PUSH_TOKEN が未設定です"
            exit 1
          fi
          git remote add dest "https://x-access-token:${PUSH_TOKEN}@github.com/Stand-koike/otohiroi-mvp-.git"
          git push dest HEAD:main --force
