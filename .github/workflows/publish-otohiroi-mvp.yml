# おとひろい専用リポジトリへミラーする（手動実行）
name: Publish to otohiroi-mvp-

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout export branch
        uses: actions/checkout@v4
        with:
          ref: export/otohiroi-mvp-initial
          fetch-depth: 1

      - name: Push to otohiroi-mvp-
        env:
          GH_TOKEN: ${{ secrets.OTOHIROI_MVP_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$GH_TOKEN" | tr -d '\n\r\t ')"
          if [ -z "$TOKEN" ]; then
            echo "::error::Secrets に OTOHIROI_MVP_PUSH_TOKEN が未設定、または空です"
            exit 1
          fi
          printf '%s\n' "$TOKEN" | gh auth login --with-token
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add dest https://github.com/Stand-koike/otohiroi-mvp-.git
          git push dest HEAD:main --force
